version: 1
metadata:
  name: "JSON Path Validation Test"
  tags:
    - jsonpath
request:
  url: "https://httpbin.org/json"
  method: GET
  headers:
    Accept: "application/json"
  body: ""

assertions:
  - type: "status_code"
    expected: 200
  - type: "json_path"
    path: "$.slideshow.author"
    expected: "Yours Truly"
  - type: "json_path"
    path: "$.slideshow.slides[0].title"
    expected: "Wake up to WonderWidgets!"

timeout_seconds: 10
