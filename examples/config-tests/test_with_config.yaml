# HTTP Test with Config
# Uses placeholders from .owl in the same directory
version: 1

metadata:
  name: "API Test with Config"
  description: "Tests API using config placeholders"

request:
  url: "${api_base_url}/users/profile"
  method: GET
  headers:
    Authorization: "${api_token}"
    Content-Type: "application/json"

assertions:
  - type: "status_code"
    expected: 200

timeout_seconds: 10
