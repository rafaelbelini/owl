version: 1
metadata:
  name: "JSON Path Filter Single Match Test"
  tags:
    - jsonpath
    - filter
request:
  url: "https://httpbin.org/json"
  method: GET
  headers:
    Accept: "application/json"
  body: ""

assertions:
  - type: "status_code"
    expected: 200
  - type: "json_path"
    path: "$.slideshow.slides.{\"title\":\"Wake up to WonderWidgets!\"}.type"
    expected: "all"

timeout_seconds: 10
