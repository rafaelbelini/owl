version: 1
metadata:
  name: "JSON Path Filter Test"
  tags:
    - jsonpath
    - filter
request:
  url: "https://httpbin.org/json"
  method: GET
  headers:
    Accept: "application/json"
  body: ""

assertions:
  - type: "status_code"
    expected: 200
  - type: "json_path"
    path: "$.slideshow.slides[0].title"
    expected: "Wake up to WonderWidgets!"
  - type: "json_path"
    path: "$.slideshow.slides.{\"title\":\"Overview\"}.items"
    expected: ["Why <em>WonderWidgets</em> are great","Who <em>buys</em> WonderWidgets"]

timeout_seconds: 10
