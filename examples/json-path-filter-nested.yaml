version: 1
metadata:
  name: "JSON Path Filter on Nested Object Test"
  tags:
    - jsonpath
    - filter
request:
  url: "https://httpbin.org/json"
  method: GET
  headers:
    Accept: "application/json"
  body: ""

assertions:
  - type: "status_code"
    expected: 200
  - type: "json_path"
    path: "$.slideshow.{\"author\":\"Yours Truly\"}.title"
    expected: "Sample Slide Show"

timeout_seconds: 10
