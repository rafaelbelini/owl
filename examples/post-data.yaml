version: 1
metadata:
  name: "Create User POST"
  tags:
    - post
    - create
request:
  url: "https://api.example.com/v1/users"
  method: POST
  headers:
    Content-Type: "application/json"
    Accept: "application/json"
  body: '{"name": "test", "email": "test@example.com"}'

assertions:
  - type: "status_code"
    expected: 201
  - type: "contains_text"
    expected: "id"

timeout_seconds: 10
